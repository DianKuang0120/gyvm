<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  允许 gyvm 组的用户调用特权 daemon（启动/停止 VM）。
  把用户加进 gyvm 组：  sudo groupadd -f gyvm && sudo usermod -aG gyvm $USER
-->
<busconfig>
  <policy user="root">
    <allow own="org.gyvm.Daemon1"/>
    <allow send_destination="org.gyvm.Daemon1"/>
  </policy>

  <policy group="gyvm">
    <allow send_destination="org.gyvm.Daemon1"/>
    <allow receive_sender="org.gyvm.Daemon1"/>
  </policy>

  <!-- 直接允许本机用户（免去加组/重新登录） -->
  <policy user="DianKuang">
    <allow send_destination="org.gyvm.Daemon1"/>
    <allow receive_sender="org.gyvm.Daemon1"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.gyvm.Daemon1"/>
  </policy>
</busconfig>
